name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vikings
          POSTGRES_PASSWORD: vikings
          POSTGRES_DB: vikings_barber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vikings -d vikings_barber_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vikings:vikings@localhost:5432/vikings_barber_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    name: Frontend (lint, tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker (stack de produção)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci0senha0de0teste
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: admin-ci-12345
      COMPOSE_FILE: docker-compose.prod.yaml

    steps:
      - uses: actions/checkout@v7

      - name: Sobe banco, API e site com as imagens de produção
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Página inicial responde (site, API e banco juntos)
        run: >-
          docker compose exec -T web node -e
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derruba a stack
        if: always()
        run: docker compose down -v

  docker-api:
    name: Docker (só API e banco)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci0senha0de0teste
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: admin-ci-12345
      COMPOSE_FILE: docker-compose.api.yaml

    steps:
      - uses: actions/checkout@v7

      - name: Sobe banco e API com a imagem de produção
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: API responde no /health (API e banco juntos)
        run: >-
          docker compose exec -T api node -e
          "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      - name: Admin criado no primeiro deploy consegue entrar
        run: >-
          docker compose exec -T api node -e
          "fetch('http://127.0.0.1:3333/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }) })
          .then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
