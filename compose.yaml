# Banco de dados para desenvolvimento local.
# Suba com: docker compose up -d
name: vikings-barber

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vikings
      POSTGRES_PASSWORD: vikings
      POSTGRES_DB: vikings_barber
    ports:
      # Só aceita conexões da própria máquina.
      - "127.0.0.1:5432:5432"
    volumes:
      # A partir do Postgres 18 o volume fica em /var/lib/postgresql (não mais em /data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikings -d vikings_barber"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
